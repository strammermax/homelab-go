name: CI

# Pull requests only; a push to main is tested and released by version.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Windows build compiles
        run: GOOS=windows go vet ./...
