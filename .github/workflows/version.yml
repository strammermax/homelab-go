name: Version

# Every push to main is a release: tests, then VERSION becomes a calendar version
# (YYYY.MM.DD.N, Europe/Amsterdam), committed and tagged v<VERSION>, then the CLI
# binaries are published as GitHub release <VERSION>.
# Same scheme as the other repos (template: D:\Project\windowsscripts\templates\version-bump.yml).
# Pushes made with GITHUB_TOKEN do not start other workflows, so the release is built here.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Bump calendar version
        id: bump
        env:
          TZ: Europe/Amsterdam
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          today="$(date '+%Y.%m.%d')"
          cur=""
          [ -f VERSION ] && cur="$(tr -d '[:space:]' < VERSION)"
          if [ -n "${BEFORE:-}" ] && [ -f VERSION ] && git cat-file -e "$BEFORE" 2>/dev/null \
             && ! git diff --quiet "$BEFORE" "$AFTER" -- VERSION; then
            new="$cur"
            echo "VERSION was changed in this push; tagging it as is."
          elif [[ "$cur" =~ ^${today//./\\.}\.([0-9]+)$ ]]; then
            new="${today}.$((10#${BASH_REMATCH[1]} + 1))"
          else
            new="${today}.1"
          fi
          echo "$new" > VERSION
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit version and create tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet || git commit -m "chore: bump version to $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "v$NEW_VERSION"
          for attempt in 1 2 3; do
            git push origin HEAD:main --follow-tags && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Build static binaries
        env:
          CGO_ENABLED: '0'
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$NEW_VERSION" \
              -o "dist/infisical-secrets-$os-$arch$ext" ./cmd/infisical-secrets
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$NEW_VERSION" dist/* --title "$NEW_VERSION" --generate-notes
